[package]
name = "jnworkerstream"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JnWorkerStream desktop shell (P2c: thin adapter over kb-app)"

[features]
# 默认把 apps/desktop/dist 打进二进制，`cargo run -p jnworkerstream` 即可直接看界面，
# 不需要另开 vite dev server。需要 HMR 时用 tauri CLI 的 dev（它会覆盖此行为）。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "jnworkerstream_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kb-app = { path = "../crates/kb-app" }
kb-inject = { path = "../crates/kb-inject" }
kb-sidecar = { path = "../crates/kb-sidecar" }
kb-transport = { path = "../crates/kb-transport" }
kb-voice = { path = "../crates/kb-voice" }
